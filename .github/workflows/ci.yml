name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.0"
          - "8.2"
          - "8.4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Lint PHP
        run: composer lint

      - name: Build release package
        run: composer build

      - name: Verify release package
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name 'mindio-magic-mcp-*.zip' -print -quit)"
          test -n "${archive}"
          unzip -t "${archive}"
          unzip -l "${archive}" | grep -q 'mindio-magic-mcp/mindio-magic-mcp.php'
          if unzip -l "${archive}" | grep -Eq '(/tests/|/\.git/|/composer\.json$|/CONTRIBUTING\.md$|/\.editorconfig$|/languages/.*\.(po|mo)$)'; then
            echo "Release archive contains development-only files." >&2
            exit 1
          fi

      - name: Upload package
        if: matrix.php == '8.0'
        uses: actions/upload-artifact@v7
        with:
          name: mindio-magic-mcp-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
